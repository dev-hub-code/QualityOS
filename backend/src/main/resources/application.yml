spring:
  application:
    name: qualityos-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    # Runtime role: no ownership and no BYPASSRLS, so row-level security applies to it.
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast during a database outage. The 30s default outlasts readiness probe timeouts.
      connection-timeout: 3000
  flyway:
    # Migrations run as the schema owner, on a connection separate from the runtime pool.
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      approle: ${DB_APP_USER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-For from the web tier, for audit IP addresses. Tomcat trusts only private addresses.
  forward-headers-strategy: native

qualityos:
  security:
    jwt:
      issuer: qualityos
      audience: qualityos-api
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
