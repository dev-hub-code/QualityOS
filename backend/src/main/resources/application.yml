spring:
  application:
    name: qualityos-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    # Runtime role: no ownership and no BYPASSRLS, so row-level security applies to it.
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast during a database outage. The 30s default outlasts readiness probe timeouts.
      connection-timeout: 3000
  flyway:
    # Migrations run as the schema owner, on a connection separate from the runtime pool.
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      approle: ${DB_APP_USER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-For from the web tier, for audit IP addresses. Tomcat trusts only private addresses.
  forward-headers-strategy: native

app:
  registration:
    # Public deployments keep the first two as they are: the prod profile will not start otherwise.
    email-verification-required: ${REGISTRATION_EMAIL_VERIFICATION_REQUIRED:true}
    allow-unverified-login: ${REGISTRATION_ALLOW_UNVERIFIED_LOGIN:false}
    verification-token-expiry-minutes: ${REGISTRATION_VERIFICATION_TOKEN_EXPIRY_MINUTES:30}
    # A sign-up unconfirmed for this long is emptied, which frees its address.
    unverified-retention: ${REGISTRATION_UNVERIFIED_RETENTION:P30D}

qualityos:
  # The address users reach the web application on, used for links in emails.
  app-url: ${APP_URL:http://localhost:3000}
  # The seller printed on invoices. Set these for the legal entity that bills before sending one to a customer.
  billing:
    seller-name: ${BILLING_SELLER_NAME:QualityOS}
    seller-gstin: ${BILLING_SELLER_GSTIN:}
    seller-address: ${BILLING_SELLER_ADDRESS:}
    # Confirm with an accountant. Printed on invoices only when set.
    sac-code: ${BILLING_SAC_CODE:}
  mail:
    from: ${MAIL_FROM:QualityOS <no-reply@qualityos.local>}
    # A language here needs a folder in resources/email-templates, and any file it lacks falls back to English.
    languages: en,hi,mr
    retry-delay: ${MAIL_RETRY_DELAY:5s}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    # Each job waits initial-delay after startup, then interval after the end of each run.
    notification-delivery:
      initial-delay: PT30S
      interval: PT30S
    capa-reminders:
      initial-delay: PT5M
      interval: PT1H
    calibration-reminders:
      initial-delay: PT5M
      interval: PT1H
    subscription-notices:
      initial-delay: PT6M
      interval: PT1H
    unconfirmed-shipments:
      initial-delay: PT5M
      interval: PT1H
    account-maintenance:
      initial-delay: PT1H
      interval: PT24H
    monitor:
      interval: PT15M
  storage:
    local-root: ${STORAGE_LOCAL_ROOT}
  security:
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
    jwt:
      issuer: qualityos
      audience: qualityos-api
      access-token-ttl: 15m
      refresh-token-ttl: 14d
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}

management:
  health:
    # Readiness must not depend on a mail server: mail is retried, and sign-in works without it.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
