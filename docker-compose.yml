# Local stack. The defaults are development-only credentials; override them in .env (see .env.example).
name: qualityos

x-db-credentials: &db-credentials
  DB_APP_USER: ${DB_APP_USER:-qualityos_app}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:-qualityos_app_local}
  DB_MIGRATION_USER: ${DB_MIGRATION_USER:-qualityos_migrator}
  DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-qualityos_migrator_local}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      <<: *db-credentials
      POSTGRES_DB: qualityos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Probes over TCP: the temporary server used during init only listens on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d qualityos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email sent locally; nothing leaves this machine. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  backend:
    build: ./backend
    environment:
      <<: *db-credentials
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/qualityos
      STORAGE_LOCAL_ROOT: /data/attachments
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-QualityOS <no-reply@qualityos.local>}
      BILLING_SELLER_NAME: ${BILLING_SELLER_NAME:-QualityOS}
      BILLING_SELLER_GSTIN: ${BILLING_SELLER_GSTIN:-}
      BILLING_SELLER_ADDRESS: ${BILLING_SELLER_ADDRESS:-}
      BILLING_SAC_CODE: ${BILLING_SAC_CODE:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
      REGISTRATION_EMAIL_VERIFICATION_REQUIRED: ${REGISTRATION_EMAIL_VERIFICATION_REQUIRED:-true}
      REGISTRATION_ALLOW_UNVERIFIED_LOGIN: ${REGISTRATION_ALLOW_UNVERIFIED_LOGIN:-false}
      # Above the production default, because the browser tests all sign in from one address.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - attachments-data:/data/attachments
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      # Plain HTTP on localhost. Must stay unset behind HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  attachments-data:
