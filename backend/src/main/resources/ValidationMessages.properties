# Plain-language messages for the standard constraints, shown under the field that failed. An annotation with its
# own message keeps it. Hibernate Validator reads this bundle in place of its own defaults.
jakarta.validation.constraints.NotNull.message=This is required.
jakarta.validation.constraints.NotBlank.message=This is required.
jakarta.validation.constraints.NotEmpty.message=Add at least one.
jakarta.validation.constraints.Size.message=Use between {min} and {max} characters.
jakarta.validation.constraints.Email.message=Enter a valid email.
jakarta.validation.constraints.Positive.message=Enter a number above zero.
jakarta.validation.constraints.PositiveOrZero.message=Cannot be negative.
jakarta.validation.constraints.Negative.message=Enter a number below zero.
jakarta.validation.constraints.NegativeOrZero.message=Cannot be above zero.
jakarta.validation.constraints.Min.message=Enter {value} or more.
jakarta.validation.constraints.Max.message=Enter {value} or less.
jakarta.validation.constraints.DecimalMin.message=Enter a number ${inclusive == true ? 'of' : 'above'} {value}${inclusive == true ? ' or more' : ''}.
jakarta.validation.constraints.DecimalMax.message=Enter a number ${inclusive == true ? 'of' : 'below'} {value}${inclusive == true ? ' or less' : ''}.
jakarta.validation.constraints.Digits.message=Use at most {integer} digits before the decimal point and {fraction} after it.
jakarta.validation.constraints.Future.message=Choose a date after today.
jakarta.validation.constraints.FutureOrPresent.message=Choose today or a later date.
jakarta.validation.constraints.Past.message=Choose a date before today.
jakarta.validation.constraints.PastOrPresent.message=The date cannot be in the future.
jakarta.validation.constraints.Pattern.message=This is not in the expected format.
